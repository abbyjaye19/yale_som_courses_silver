services:
  # FastAPI backend. Serves /api/courses and /api/chat.
  - type: web
    name: yale-som-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # pydantic-ai needs 3.12+
      - key: PYTHON_VERSION
        value: "3.12"
      # Set the real value in the Render dashboard. Never commit the key.
      - key: PORTKEY_API_KEY
        sync: false

  # React build, served from Render's CDN.
  - type: web
    name: yale-som-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Render fills in the API's hostname; api.ts adds the https:// prefix.
      - key: VITE_API_URL
        fromService:
          type: web
          name: yale-som-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
